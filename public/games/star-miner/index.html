<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Miner — k399game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617; color: #f8fafc; font-family: 'JetBrains Mono', monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #22c55e; }
    .meta { color: #64748b; font-size: 0.75rem; margin-bottom: 1rem; }
    canvas { border: 1px solid #1e293b; border-radius: 8px; background: #0f172a; }
    .controls { margin-top: 1rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    button { background: #22c55e; color: #020617; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #4ade80; }
    .stat { color: #22c55e; font-size: 1rem; }
    .hint { margin-top: 0.5rem; color: #475569; font-size: 0.7rem; }
  </style>
</head>
<body>
  <h1>Star Miner</h1>
  <div class="meta">100% AI Generated • Click asteroids to mine minerals</div>
  <canvas id="game" width="600" height="400"></canvas>
  <div class="controls">
    <div class="stat">Credits: <span id="credits">0</span></div>
    <div class="stat">Minerals: <span id="minerals">0</span></div>
    <button id="upgradeBtn" onclick="upgrade()">Upgrade Drill (100)</button>
  </div>
  <div class="hint">Different colored asteroids yield different minerals. Upgrade to mine faster.</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let asteroids = [], particles = [];
    let credits = 0, minerals = 0, drillPower = 1, drillLevel = 1, upgradeCost = 100;
    const colors = ['#94a3b8', '#22c55e', '#22d3ee', '#f472b6', '#fbbf24'];
    const values = [1, 3, 5, 10, 25];

    function spawnAsteroid() {
      const type = Math.floor(Math.random() * colors.length);
      asteroids.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: Math.random() * (canvas.height - 40) + 20,
        r: 15 + Math.random() * 20,
        type,
        hp: (type + 1) * 10,
        maxHp: (type + 1) * 10
      });
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 40; i++) {
        const x = (i * 137) % canvas.width;
        const y = (i * 53) % canvas.height;
        ctx.globalAlpha = 0.3 + (i % 5) / 10;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;

      asteroids.forEach(a => {
        ctx.fillStyle = colors[a.type];
        ctx.shadowColor = colors[a.type];
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // HP ring
        const pct = a.hp / a.maxHp;
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
        ctx.stroke();
        ctx.lineWidth = 1;
      });

      particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;
    }

    function click(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        const dx = x - a.x, dy = y - a.y;
        if (Math.sqrt(dx * dx + dy * dy) < a.r) {
          a.hp -= drillPower;
          for (let k = 0; k < 5; k++) {
            particles.push({
              x: a.x, y: a.y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              life: 1,
              color: colors[a.type]
            });
          }
          if (a.hp <= 0) {
            const gain = values[a.type] * drillLevel;
            credits += gain;
            minerals += Math.max(1, Math.floor(gain / 2));
            asteroids.splice(i, 1);
            updateUI();
          }
          break;
        }
      }
    }

    function upgrade() {
      if (credits >= upgradeCost) {
        credits -= upgradeCost;
        drillLevel++;
        drillPower += 2;
        upgradeCost = Math.floor(upgradeCost * 1.5);
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('credits').textContent = credits;
      document.getElementById('minerals').textContent = minerals;
      document.getElementById('upgradeBtn').textContent = `Upgrade Drill (${upgradeCost})`;
    }

    function loop() {
      if (asteroids.length < 6) spawnAsteroid();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousedown', click);
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      click({ clientX: touch.clientX, clientY: touch.clientY });
    });

    for (let i = 0; i < 6; i++) spawnAsteroid();
    loop();
  </script>
</body>
</html>
