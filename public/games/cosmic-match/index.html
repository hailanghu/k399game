<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Match — k399game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; color: #f8fafc; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #22c55e; }
    .meta { color: #64748b; font-size: 0.75rem; margin-bottom: 1rem; }
    canvas { border: 1px solid #1e293b; border-radius: 8px; background: #0f172a; }
    .controls { margin-top: 1rem; display: flex; gap: 1rem; align-items: center; }
    button { background: #22c55e; color: #020617; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #4ade80; }
    .score { color: #22c55e; font-size: 1.2rem; }
    .hint { margin-top: 0.5rem; color: #475569; font-size: 0.7rem; }
  </style>
</head>
<body>
  <h1>Cosmic Match</h1>
  <div class="meta">100% AI Generated • Click two gems to swap</div>
  <canvas id="game" width="480" height="480"></canvas>
  <div class="controls">
    <div class="score">Score: <span id="score">0</span></div>
    <button onclick="restart()">Shuffle</button>
  </div>
  <div class="hint">Line up 3+ matching cosmic gems to score.</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const size = 8, cell = 60;
    const types = ['sun', 'moon', 'star', 'comet', 'planet'];
    const colors = ['#fbbf24', '#94a3b8', '#22c55e', '#22d3ee', '#f472b6'];
    const shapes = ['★', '●', '◆', '▲', '■'];

    let grid = [], selected = null, score = 0;

    function randomType() { return Math.floor(Math.random() * types.length); }

    function initGrid() {
      grid = [];
      for (let y = 0; y < size; y++) {
        grid[y] = [];
        for (let x = 0; x < size; x++) {
          let t;
          do { t = randomType(); }
          while ((x >= 2 && grid[y][x-1] === t && grid[y][x-2] === t) || (y >= 2 && grid[y-1][x] === t && grid[y-2][x] === t));
          grid[y][x] = t;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const px = x * cell, py = y * cell;
          ctx.fillStyle = (x + y) % 2 === 0 ? '#1e293b' : '#172033';
          ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);

          if (selected && selected.x === x && selected.y === y) {
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 3, py + 3, cell - 6, cell - 6);
          }

          const t = grid[y][x];
          if (t === null) continue;
          ctx.fillStyle = colors[t];
          ctx.shadowColor = colors[t];
          ctx.shadowBlur = 10;
          ctx.font = 'bold 32px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(shapes[t], px + cell / 2, py + cell / 2);
          ctx.shadowBlur = 0;
        }
      }
    }

    function findMatches() {
      const matches = new Set();
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size - 2; x++) {
          const t = grid[y][x];
          if (t !== null && grid[y][x+1] === t && grid[y][x+2] === t) {
            matches.add(`${x},${y}`); matches.add(`${x+1},${y}`); matches.add(`${x+2},${y}`);
          }
        }
      }
      for (let x = 0; x < size; x++) {
        for (let y = 0; y < size - 2; y++) {
          const t = grid[y][x];
          if (t !== null && grid[y+1][x] === t && grid[y+2][x] === t) {
            matches.add(`${x},${y}`); matches.add(`${x},${y+1}`); matches.add(`${x},${y+2}`);
          }
        }
      }
      return matches;
    }

    function removeMatches() {
      const matches = findMatches();
      if (matches.size === 0) return false;
      score += matches.size * 10;
      document.getElementById('score').textContent = score;
      matches.forEach(m => {
        const [x, y] = m.split(',').map(Number);
        grid[y][x] = null;
      });
      draw();
      setTimeout(dropGems, 200);
      return true;
    }

    function dropGems() {
      for (let x = 0; x < size; x++) {
        let col = [];
        for (let y = size - 1; y >= 0; y--) if (grid[y][x] !== null) col.push(grid[y][x]);
        while (col.length < size) col.push(randomType());
        for (let y = size - 1; y >= 0; y--) grid[y][x] = col[size - 1 - y];
      }
      draw();
      setTimeout(() => { if (removeMatches()) draw(); }, 300);
    }

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / cell);
      const y = Math.floor((e.clientY - rect.top) / cell);
      if (!selected) { selected = { x, y }; }
      else {
        const dx = Math.abs(x - selected.x), dy = Math.abs(y - selected.y);
        if (dx + dy === 1) {
          [grid[selected.y][selected.x], grid[y][x]] = [grid[y][x], grid[selected.y][selected.x]];
          if (!findMatches().size) {
            [grid[selected.y][selected.x], grid[y][x]] = [grid[y][x], grid[selected.y][selected.x]];
          } else {
            draw();
            setTimeout(removeMatches, 200);
          }
        }
        selected = null;
      }
      draw();
    });

    function restart() { initGrid(); score = 0; document.getElementById('score').textContent = score; draw(); }

    initGrid(); draw();
  </script>
</body>
</html>
