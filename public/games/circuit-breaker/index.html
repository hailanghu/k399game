<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Breaker — k399game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; color: #f8fafc; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #22c55e; }
    .meta { color: #64748b; font-size: 0.75rem; margin-bottom: 1rem; }
    canvas { border: 1px solid #1e293b; border-radius: 8px; background: #0f172a; }
    .controls { margin-top: 1rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    button { background: #22c55e; color: #020617; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #4ade80; }
    .stat { color: #22c55e; font-size: 1rem; }
    .hint { margin-top: 0.5rem; color: #475569; font-size: 0.7rem; }
  </style>
</head>
<body>
  <h1>Circuit Breaker</h1>
  <div class="meta">100% AI Generated • Click pieces to rotate and connect power</div>
  <canvas id="game" width="500" height="500"></canvas>
  <div class="controls">
    <div class="stat">Level: <span id="level">1</span></div>
    <div class="stat">Time: <span id="time">30</span>s</div>
    <button onclick="restart()">New Circuit</button>
  </div>
  <div class="hint">Connect the green power source to the cyan target before time runs out.</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const size = 6, cell = 80;
    canvas.width = size * cell;
    canvas.height = size * cell;

    const STRAIGHT = 0, CORNER = 1, T = 2, CROSS = 3;
    let grid = [], level = 1, timeLeft = 30, timer, power = { x: 0, y: 0 }, target = { x: 5, y: 5 }, gameOver = false;

    function rotateType(type) {
      return Math.floor(Math.random() * 4);
    }

    function createPiece(type, fixed = false) {
      return { type, rotation: fixed ? 0 : Math.floor(Math.random() * 4), fixed, powered: false };
    }

    function initGrid() {
      grid = [];
      for (let y = 0; y < size; y++) {
        grid[y] = [];
        for (let x = 0; x < size; x++) {
          let type;
          if ((x + y) % 3 === 0) type = CROSS;
          else if ((x + y) % 2 === 0) type = T;
          else if (Math.random() > 0.5) type = STRAIGHT;
          else type = CORNER;
          const fixed = (x === 0 && y === 0) || (x === size - 1 && y === size - 1);
          grid[y][x] = createPiece(type, fixed);
        }
      }
      // Ensure solvable path exists
      let cx = 0, cy = 0;
      while (cx < size - 1 || cy < size - 1) {
        grid[cy][cx].fixed = true;
        grid[cy][cx].rotation = 0;
        if (cx < size - 1 && (cy === size - 1 || Math.random() > 0.5)) {
          grid[cy][cx].type = cx === 0 && cy === 0 ? CORNER : T;
          cx++;
        } else {
          grid[cy][cx].type = cy === 0 ? STRAIGHT : T;
          cy++;
        }
      }
      grid[size-1][size-1].fixed = true;
      // Scramble unfixed
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!grid[y][x].fixed) grid[y][x].rotation = Math.floor(Math.random() * 4);
      timeLeft = Math.max(20, 35 - level * 2);
      gameOver = false;
      clearInterval(timer);
      timer = setInterval(() => {
        if (gameOver) return;
        timeLeft--;
        document.getElementById('time').textContent = timeLeft;
        if (timeLeft <= 0) { gameOver = true; draw(); }
      }, 1000);
    }

    function getConnections(type, rotation) {
      // returns [top, right, bottom, left]
      let base;
      switch (type) {
        case STRAIGHT: base = [1, 0, 1, 0]; break;
        case CORNER: base = [1, 1, 0, 0]; break;
        case T: base = [1, 1, 1, 0]; break;
        case CROSS: base = [1, 1, 1, 1]; break;
      }
      for (let i = 0; i < rotation; i++) base.unshift(base.pop());
      return base;
    }

    function checkWin() {
      // BFS from power
      const visited = Array(size).fill().map(() => Array(size).fill(false));
      const queue = [{ x: 0, y: 0 }];
      visited[0][0] = true;
      while (queue.length) {
        const { x, y } = queue.shift();
        if (x === size - 1 && y === size - 1) return true;
        const conn = getConnections(grid[y][x].type, grid[y][x].rotation);
        const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
        for (let i = 0; i < 4; i++) {
          if (!conn[i]) continue;
          const nx = x + dirs[i][0], ny = y + dirs[i][1];
          if (nx < 0 || nx >= size || ny < 0 || ny >= size || visited[ny][nx]) continue;
          const opp = getConnections(grid[ny][nx].type, grid[ny][nx].rotation);
          if (opp[(i + 2) % 4]) {
            visited[ny][nx] = true;
            queue.push({ x: nx, y: ny });
          }
        }
      }
      return false;
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const won = checkWin();
      if (won) gameOver = true;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const px = x * cell + cell / 2, py = y * cell + cell / 2;
          const p = grid[y][x];
          ctx.strokeStyle = p.fixed ? '#22c55e' : '#475569';
          if (won) ctx.strokeStyle = '#22d3ee';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          const conn = getConnections(p.type, p.rotation);
          ctx.beginPath();
          ctx.moveTo(px, py);
          if (conn[0]) ctx.lineTo(px, py - cell / 2 + 4);
          if (conn[1]) ctx.lineTo(px + cell / 2 - 4, py);
          if (conn[2]) ctx.lineTo(px, py + cell / 2 - 4);
          if (conn[3]) ctx.lineTo(px - cell / 2 + 4, py);
          ctx.stroke();

          // Center dot
          ctx.fillStyle = p.fixed ? '#22c55e' : '#64748b';
          ctx.beginPath();
          ctx.arc(px, py, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Power and target
      ctx.fillStyle = '#22c55e';
      ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 15;
      ctx.fillRect(10, 10, 20, 20);
      ctx.fillStyle = '#22d3ee';
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 15;
      ctx.fillRect(canvas.width - 30, canvas.height - 30, 20, 20);
      ctx.shadowBlur = 0;

      if (won) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CIRCUIT COMPLETE', canvas.width / 2, canvas.height / 2);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Click New Circuit for next level', canvas.width / 2, canvas.height / 2 + 30);
      } else if (timeLeft <= 0) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('TIME OUT', canvas.width / 2, canvas.height / 2);
      }
    }

    canvas.addEventListener('mousedown', e => {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / cell);
      const y = Math.floor((e.clientY - rect.top) / cell);
      if (grid[y] && grid[y][x] && !grid[y][x].fixed) {
        grid[y][x].rotation = (grid[y][x].rotation + 1) % 4;
        draw();
      }
    });

    function restart() {
      if (checkWin() && timeLeft > 0) level++;
      document.getElementById('level').textContent = level;
      initGrid();
      draw();
    }

    initGrid();
    draw();
  </script>
</body>
</html>
