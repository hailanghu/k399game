<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dungeon Crawl — k399game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; color: #f8fafc; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #22c55e; }
    .meta { color: #64748b; font-size: 0.75rem; margin-bottom: 1rem; }
    canvas { border: 1px solid #1e293b; border-radius: 8px; background: #0f172a; }
    .controls { margin-top: 1rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    button { background: #22c55e; color: #020617; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #4ade80; }
    .stat { color: #22c55e; font-size: 1rem; }
    .hint { margin-top: 0.5rem; color: #475569; font-size: 0.7rem; }
  </style>
</head>
<body>
  <h1>AI Dungeon Crawl</h1>
  <div class="meta">100% AI Generated • Arrow keys to move, bump enemies to fight</div>
  <canvas id="game" width="600" height="400"></canvas>
  <div class="controls">
    <div class="stat">HP: <span id="hp">10</span></div>
    <div class="stat">Gold: <span id="gold">0</span></div>
    <div class="stat">Level: <span id="level">1</span></div>
    <button onclick="restart()">New Dungeon</button>
  </div>
  <div class="hint">Find the cyan stairs to descend deeper. Red enemies hurt you back.</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const cols = 30, rows = 20, cell = 20;

    let map = [], player = {}, enemies = [], gold = 0, hp = 10, level = 1, stairs = {};

    function generateMap() {
      map = Array(rows).fill().map(() => Array(cols).fill(1));
      const rooms = [];
      for (let i = 0; i < 8; i++) {
        const w = 4 + Math.floor(Math.random() * 4);
        const h = 4 + Math.floor(Math.random() * 4);
        const x = 1 + Math.floor(Math.random() * (cols - w - 2));
        const y = 1 + Math.floor(Math.random() * (rows - h - 2));
        rooms.push({ x, y, w, h });
        for (let ry = y; ry < y + h; ry++) {
          for (let rx = x; rx < x + w; rx++) map[ry][rx] = 0;
        }
      }
      for (let i = 0; i < rooms.length - 1; i++) {
        const a = rooms[i], b = rooms[i + 1];
        const ax = Math.floor(a.x + a.w / 2), ay = Math.floor(a.y + a.h / 2);
        const bx = Math.floor(b.x + b.w / 2), by = Math.floor(b.y + b.h / 2);
        for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) map[ay][x] = 0;
        for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) map[y][bx] = 0;
      }
      player = { x: rooms[0].x + 1, y: rooms[0].y + 1 };
      stairs = { x: rooms[rooms.length - 1].x + 1, y: rooms[rooms.length - 1].y + 1 };
      enemies = [];
      for (let i = 3; i < rooms.length - 1; i++) {
        enemies.push({ x: rooms[i].x + 1, y: rooms[i].y + 1, hp: 2 + level });
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Fog of war effect: only draw visible area around player
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const dist = Math.sqrt((x - player.x) ** 2 + (y - player.y) ** 2);
          if (dist > 7) continue;
          const px = x * cell, py = y * cell;
          if (map[y][x] === 1) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(px, py, cell, cell);
          } else {
            ctx.fillStyle = '#0b1221';
            ctx.fillRect(px, py, cell, cell);
          }
        }
      }

      // Stairs
      const sx = stairs.x * cell + 4, sy = stairs.y * cell + 4;
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(sx, sy, cell - 8, cell - 8);

      // Enemies
      enemies.forEach(e => {
        const ex = e.x * cell + 4, ey = e.y * cell + 4;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(ex, ey, cell - 8, cell - 8);
      });

      // Player
      const px = player.x * cell + 3, py = player.y * cell + 3;
      ctx.fillStyle = '#22c55e';
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 10;
      ctx.fillRect(px, py, cell - 6, cell - 6);
      ctx.shadowBlur = 0;

      if (hp <= 0) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('YOU DIED', canvas.width / 2, canvas.height / 2);
      }
    }

    function move(dx, dy) {
      if (hp <= 0) return;
      const nx = player.x + dx, ny = player.y + dy;
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows || map[ny][nx] === 1) return;

      const enemy = enemies.find(e => e.x === nx && e.y === ny);
      if (enemy) {
        enemy.hp -= 2;
        hp -= 1;
        if (enemy.hp <= 0) {
          enemies = enemies.filter(e => e !== enemy);
          gold += 5 + level * 2;
        }
      } else {
        player.x = nx; player.y = ny;
      }

      if (player.x === stairs.x && player.y === stairs.y) {
        level++;
        hp = Math.min(hp + 3, 10 + level);
        generateMap();
      }

      updateUI();
      draw();
    }

    function updateUI() {
      document.getElementById('hp').textContent = hp;
      document.getElementById('gold').textContent = gold;
      document.getElementById('level').textContent = level;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') move(0, -1);
      if (e.key === 'ArrowDown') move(0, 1);
      if (e.key === 'ArrowLeft') move(-1, 0);
      if (e.key === 'ArrowRight') move(1, 0);
    });

    function restart() { level = 1; gold = 0; hp = 10; generateMap(); updateUI(); draw(); }
    generateMap(); updateUI(); draw();
  </script>
</body>
</html>
