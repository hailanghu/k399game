# Cloudflare Pages 部署配置
name = "k399game"
compatibility_date = "2025-07-24"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# 环境变量
[vars]
NODE_VERSION = "20"

# 生产环境绑定
[env.production]

# D1 数据库绑定
[[env.production.d1_databases]]
binding = "DB"
database_name = "k399game-db"
database_id = "3ab901cc-cbd2-412e-bc26-bc59772373ac"

# Secret 环境变量（生产环境）请通过 wrangler pages secret put 设置：
# wrangler pages secret put ADMIN_PASSWORD --project-name=k399game
# wrangler pages secret put DEEPSEEK_API_KEY --project-name=k399game
